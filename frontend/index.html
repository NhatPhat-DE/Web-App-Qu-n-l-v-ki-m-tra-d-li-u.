<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="DataGuard SME — Quản lý danh mục, phiên bản CSV và kiểm tra chất lượng dữ liệu doanh nghiệp." />
    <title>DataGuard SME — Danh mục và chất lượng dữ liệu</title>
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('dataguard-theme') || 'system';
          var resolved = pref;
          if (pref === 'system') {
            resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-preference', pref);
          document.documentElement.style.colorScheme = resolved === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
